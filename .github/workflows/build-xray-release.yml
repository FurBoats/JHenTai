name: Build Xray Release (Android + Windows)

# Builds the Android APKs and the Windows client (portable zip + Inno
# Setup installer) of the xray fork and publishes them as a GitHub
# Release. Triggered by pushing a `Jhentai-*` tag (the daily
# sync-upstream workflow creates those) or manually via workflow_dispatch.
# Release tags follow the scheme:
#   Jhentai-<JHenTai version>-<Xray version>-<build date YYYYMMDD>
# If a file release-notes/<tag>.md exists in the repo, it becomes the
# release body; otherwise a minimal generated body is used.
# Convention: a release-notes file lists ONLY that release's changes —
# never a cumulative history.

on:
  push:
    tags:
      - 'Jhentai-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = Jhentai-<ver>-<xrayver>-<date>)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  BuildAndroid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FLUTTER_VERSION: 3.44.8
      LIBXRAY_VERSION: v26.10.31
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      # Same keystore secrets as the upstream build_publish workflow. When
      # they are not configured, fall back to an ephemeral CI keystore so the
      # release build is still signed and installable (with a throwaway key).
      - name: Setup Android keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -di > android/app/upload-keystore.jks
            echo "$KEY_PROPERTIES" > android/key.properties
          else
            echo "No keystore secrets configured, generating an ephemeral CI keystore"
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=JHenTai Xray CI, OU=CI, O=FurBoats, L=NA, ST=NA, C=US"
            printf 'storePassword=android\nkeyPassword=android\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' > android/key.properties
          fi

      - name: Setup JHenTai API secret
        env:
          JH_API_SECRET_CONFIG: ${{ secrets.JH_API_SECRET_CONFIG }}
        run: |
          if [ -n "$JH_API_SECRET_CONFIG" ]; then
            echo "$JH_API_SECRET_CONFIG" > lib/src/config/jh_api_secret_config.dart
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'master'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      # The embedded Xray core AAR (52MB) is not committed to git. Download
      # the exact LibXray release the fork is developed against and verify
      # both the zip and the extracted AAR by sha256.
      - name: Download LibXray AAR
        env:
          LIBXRAY_ZIP_SHA256: fb99f04acf379cc2957c1e1d0ce2b3c0005d3f49974a44c09a11242a0562c1ca
          LIBXRAY_AAR_SHA256: 4c90532f61ff8363e7fcf52e064ff1aa66d065e06afbadc0ea4c6acf384c452f
        run: |
          curl -sSL -o /tmp/libxray-android.zip \
            "https://github.com/XTLS/LibXray/releases/download/${LIBXRAY_VERSION}/libxray-android.zip"
          echo "${LIBXRAY_ZIP_SHA256}  /tmp/libxray-android.zip" | sha256sum -c -
          mkdir -p android/app/libs
          unzip -o -j /tmp/libxray-android.zip 'libxray-android/libXray.aar' -d android/app/libs
          echo "${LIBXRAY_AAR_SHA256}  android/app/libs/libXray.aar" | sha256sum -c -

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)" >> $GITHUB_OUTPUT

      - name: Build Android APKs
        run: |
          # Rename split APKs BEFORE the universal build: a second
          # `flutter build apk` run clears the gradle output dir
          # (build/app/outputs/apk/release), wiping the split APKs there.
          # The flutter-apk dir keeps copies of every build's output.
          flutter build apk -t lib/src/main.dart --release --split-per-abi --dart-define=EHSR_BUILTIN_KEY=${{ secrets.EHSR_BUILTIN_KEY }}
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk JHenTai-${{ steps.get_version.outputs.version }}-xray-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk JHenTai-${{ steps.get_version.outputs.version }}-xray-armeabi-v7a.apk
          mv app-x86_64-release.apk JHenTai-${{ steps.get_version.outputs.version }}-xray-x86_64.apk
          cd "$GITHUB_WORKSPACE"
          flutter build apk -t lib/src/main.dart --release --dart-define=EHSR_BUILTIN_KEY=${{ secrets.EHSR_BUILTIN_KEY }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/JHenTai-${{ steps.get_version.outputs.version }}-xray-universal.apk

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              APPVER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
              XRAYVER="${LIBXRAY_VERSION#v}"
              TAG="Jhentai-${APPVER}-${XRAYVER}-$(date -u +%Y%m%d)"
            fi
            # action-gh-release needs an existing tag for a non-default
            # target; create and push it only when it is not already on
            # the remote (e.g. the tag was created by publishing the
            # release in the web UI). A local `git rev-parse` is not
            # enough: a shallow checkout may not have fetched the tag.
            if git ls-remote --tags origin "$TAG" | grep -q .; then
              echo "Tag $TAG already exists on remote, reusing it."
            else
              git tag "$TAG"
              git push origin "refs/tags/$TAG"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Release body: prefer the curated notes file for this tag.
          if [ -f "release-notes/${TAG}.md" ]; then
            echo "body_file=release-notes/${TAG}.md" >> $GITHUB_OUTPUT
          else
            printf 'JHenTai %s with built-in Xray core (%s).\n' "$TAG" "$LIBXRAY_VERSION" > /tmp/release-body.md
            echo "body_file=/tmp/release-body.md" >> $GITHUB_OUTPUT
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          body_path: ${{ steps.release_tag.outputs.body_file }}
          files: build/app/outputs/flutter-apk/JHenTai-*.apk

  # Windows client: same libXray build as the Android AAR, shipped as
  # libXray.dll beside the executable and driven from Dart via FFI
  # (XrayWindowsBridge). Produces a portable zip (portable.flag + data in
  # JH_Data next to the exe) and an Inno Setup installer (per-user,
  # data in AppData). Runs after the Android job so the release and its
  # body exist before the Windows assets are attached.
  BuildWindows:
    needs: BuildAndroid
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FLUTTER_VERSION: 3.44.8
      LIBXRAY_VERSION: v26.10.31
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JHenTai API secret
        shell: bash
        env:
          JH_API_SECRET_CONFIG: ${{ secrets.JH_API_SECRET_CONFIG }}
        run: |
          if [ -n "$JH_API_SECRET_CONFIG" ]; then
            echo "$JH_API_SECRET_CONFIG" > lib/src/config/jh_api_secret_config.dart
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'master'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # The embedded Xray core DLL is not committed to git. Download the
      # exact LibXray release the fork is developed against and verify the
      # zip by sha256. windows/CMakeLists.txt bundles the DLL beside the
      # executable when it sits in windows/ at build time.
      - name: Download LibXray DLL
        shell: bash
        env:
          LIBXRAY_WIN_ZIP_SHA256: 9a3b1548667836a42b48bb0e37505726d4cd72e8429182e870b92df4cc8172f3
        run: |
          curl -sSL -o /tmp/libxray-windows-x64.zip \
            "https://github.com/XTLS/LibXray/releases/download/${LIBXRAY_VERSION}/libxray-windows-x64.zip"
          echo "${LIBXRAY_WIN_ZIP_SHA256}  /tmp/libxray-windows-x64.zip" | sha256sum -c -
          unzip -o -j /tmp/libxray-windows-x64.zip 'libxray-windows-x64/libXray.dll' -d windows
          ls -la windows/libXray.dll

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)" >> $GITHUB_OUTPUT

      - name: Build Windows
        # The current windows-latest image ships VS 18 / MSVC 14.52, whose
        # STL hard-errors (STL1011) on the <experimental/coroutine> usage
        # inside the local_auth_windows and permission_handler_windows
        # plugins. The CL env var adds the vendor-suggested silence define
        # to every cl.exe invocation of the build.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows -t lib/src/main.dart --release --dart-define=EHSR_BUILTIN_KEY=${{ secrets.EHSR_BUILTIN_KEY }}

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $stage = "dist/JHenTai-$ver-windows-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "build/windows/x64/runner/Release/*" $stage
          New-Item -ItemType File -Force -Path "$stage/portable.flag" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/JHenTai-$ver-windows-portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = "${{ steps.get_version.outputs.version }}"
          & $iscc "/DMyAppVersion=$ver" "installer\JHenTai.iss"
          Move-Item "installer\JHenTai-$ver-windows-setup.exe" "dist\" -Force

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              APPVER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
              XRAYVER="${LIBXRAY_VERSION#v}"
              TAG="Jhentai-${APPVER}-${XRAYVER}-$(date -u +%Y%m%d)"
            fi
            if git ls-remote --tags origin "$TAG" | grep -q .; then
              echo "Tag $TAG already exists on remote, reusing it."
            else
              git tag "$TAG"
              git push origin "refs/tags/$TAG" || git ls-remote --tags origin "$TAG" | grep -q .
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # No body_path here on purpose: the Android job owns the release
      # body (release-notes/<tag>.md, this release's changes only).
      - name: Publish release (Windows assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/JHenTai-*-windows-portable.zip
            dist/JHenTai-*-windows-setup.exe
